# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# One perf case: the real client against the real server scene and module (the bench has no mountain switch), on foot in the lot.
PERF_CASES=lot
PERF_SECONDS=20

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --delay 20 --play --seconds "$2" --json
}

# A case is a tools/shot.sh view of the lot; each leaves screenshots/<case>_<shot>.png.
VISUAL_CASES="lot"
VISUAL_SHOTS="ground far"

visual_render() {
    heavy -- timeout 300 tools/shot.sh --out="res://screenshots/${1}_ground.png" || return 1
    heavy -- timeout 300 tools/shot.sh --view=far --out="res://screenshots/${1}_far.png"
}
